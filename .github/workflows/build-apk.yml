name: Build APK from Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        unzip "virtual-camera (4).zip" -d ./source

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant Execute Permission for Gradlew
      run: |
        # This command finds the gradlew file anywhere inside the source directory
        find ./source -name "gradlew" -exec chmod +x {} \;

    - name: Build Debug APK with Gradle
      run: |
        # This finds the directory containing gradlew and runs the build there
        cd $(find ./source -name "gradlew" -exec dirname {} \; | head -n 1) && ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: virtual-camera-debug-apk
        # This uses a wildcard to find any debug APK in the build output folder
        path: "**/build/outputs/apk/debug/*.apk"
